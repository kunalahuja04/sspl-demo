<div class="h-screen w-full bg-bg-canvas flex font-body antialiased text-primary overflow-hidden">

  <!-- 1. Reusable Left Sidebar Navigation Component -->
  <sspl-side-nav [activeNavId]="activeNavId()" (navChange)="onNavChange($event)">
  </sspl-side-nav>

  <!-- 2. Main Content Container (Independently scrollable) -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto bg-bg-canvas">

    <!-- Top Header Bar Component -->
    <sspl-dashboard-header></sspl-dashboard-header>

    <!-- Main Page Content Section -->
    <main class="flex-1 p-4 md:p-6 space-y-6 max-w-7xl mx-auto w-full pb-16">

      <!-- Toast Feedback Notification Banner -->
      @if (toastMessage()) {
      <div
        class="fixed top-6 left-1/2 -translate-x-1/2 z-50 px-6 py-4 rounded-2xl flex items-center justify-between gap-4 text-body-sm font-bold shadow-2xl border-2 transition-all animate-in fade-in slide-in-from-top-4 duration-300 max-w-lg w-[92vw]"
        [class.bg-emerald-600]="toastMessage()?.type === 'success'"
        [class.text-white]="toastMessage()?.type === 'success'"
        [class.border-emerald-700]="toastMessage()?.type === 'success'"
        [class.bg-[#0B1E36]]="toastMessage()?.type === 'info'"
        [class.text-white]="toastMessage()?.type === 'info'"
        [class.border-[#0B1E36]]="toastMessage()?.type === 'info'"
        [class.bg-red-600]="toastMessage()?.type === 'error'"
        [class.text-white]="toastMessage()?.type === 'error'"
        [class.border-red-700]="toastMessage()?.type === 'error'">
        <div class="flex items-center gap-3">
          @if (toastMessage()?.type === 'error') {
            <span class="text-2xl shrink-0">🚨</span>
          } @else if (toastMessage()?.type === 'success') {
            <span class="text-2xl shrink-0">✅</span>
          } @else {
            <span class="text-2xl shrink-0">ℹ️</span>
          }
          <span class="leading-snug">{{ toastMessage()?.text }}</span>
        </div>
        <button type="button" (click)="toastMessage.set(null)"
          class="w-7 h-7 rounded-full bg-white/20 hover:bg-white/30 text-white flex items-center justify-center cursor-pointer shrink-0 font-extrabold text-sm">✕</button>
      </div>
      }

      <!-- 3. Metric KPI Stat Cards Component -->
      <sspl-kpi-cards></sspl-kpi-cards>

      <!-- 4. Account List Table Component -->
      <sspl-account-list (balanceEnquiry)="openBalanceEnquiry($event)" (exportClick)="openExport()">
      </sspl-account-list>

      <!-- 5. Recent Transactions Component -->
      <sspl-recent-transactions (viewStatementClick)="onViewStatement()">
      </sspl-recent-transactions>

      <!-- 6. Loan Applications & Ongoing Facilities Section -->
      <sspl-loan-applications-list></sspl-loan-applications-list>

    </main>

  </div>

  <!-- 7. Export Statement Modal Component -->
  @if (isExportModalOpen()) {
  <sspl-export-modal (close)="closeExport()" (download)="downloadStatement($event)">
  </sspl-export-modal>
  }

</div>
